<!doctype html><html lang="es"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;background:#f4f8f7;font:16px system-ui;color:#17342d}.app{max-width:680px;margin:auto;padding:16px}h1{margin:0}button,input{font:inherit}button{border:0;border-radius:10px;padding:11px;font-weight:bold;cursor:pointer}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#fff;border-radius:15px;padding:14px;margin-top:12px}.green{background:#087264;color:white}.soft{background:#e5f4f0;color:#075f56}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{background:#dff4ed;padding:12px;border-radius:14px}.metric b{font-size:28px;color:#087264}.nearest{grid-column:1/-1;background:#fff;padding:12px;border-radius:14px}#map{height:55vh;min-height:300px;border-radius:15px;margin-top:12px;overflow:hidden}.wide{width:100%;margin-top:12px}.list div{background:white;margin-top:7px;padding:11px;border-radius:10px;display:flex;justify-content:space-between;gap:8px}.pin{background:#d58b00;color:white;border:2px solid white;border-radius:50%;padding:7px;font-size:10px;font-weight:bold}</style><main class="app"><div class="top"><div><small>OPERACIÓN EN RUTA</small><h1>Clientes GPS</h1></div><button class="soft" onclick="gps()">⌖ Mi ubicación</button></div><div class="card" id="status">Activa tu ubicación para empezar.</div><div class="grid"><div class="metric">CLIENTES<br><b id="n">0</b></div><div class="metric">PENDIENTES<br><b id="p">0</b></div><div class="nearest">★ MÁS CERCANO<br><span id="near">Obtén tu ubicación.</span></div></div><div id="map"></div><button class="green wide" onclick="add()">＋ Registrar cliente aquí</button><button class="soft wide" onclick="show()">Ver clientes / visitas</button><div class="list" id="list"></div></main><script>let pos,cs=JSON.parse(localStorage.getItem('tat')||'[]'),m=L.map('map').setView([7.89,-72.51],14),g=L.layerGroup().addTo(m);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(m);function d(a,b){let r=Math.PI/180,x=(b.lat-a.lat)*r,y=(b.lng-a.lng)*r,h=Math.sin(x/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(y/2)**2;return 12742000*Math.atan2(Math.sqrt(h),Math.sqrt(1-h))}function draw(){g.clearLayers();let pts=[];if(pos){L.marker(pos).addTo(g);pts.push(pos)}cs.forEach(c=>{L.marker(c,{icon:L.divIcon({className:'',html:'<span class="pin">'+(c.done?'✓':'C')+'</span>'})}).bindPopup('<b>'+c.name+'</b><br>'+c.code).addTo(g);pts.push(c)});if(pts.length>1)m.fitBounds(pts,{padding:[25,25],maxZoom:16});document.querySelector('#n').textContent=cs.length;document.querySelector('#p').textContent=cs.filter(c=>!c.done).length;let z=pos&&cs.length?cs.map(c=>[c,d(pos,c)]).sort((a,b)=>a[1]-b[1])[0]:null;document.querySelector('#near').textContent=z?z[0].name+' · '+z[0].code+' · '+Math.round(z[1])+' m':'Obtén tu ubicación.'}function gps(){navigator.geolocation.getCurrentPosition(x=>{pos={lat:x.coords.latitude,lng:x.coords.longitude};document.querySelector('#status').textContent='Ubicación lista.';draw()},()=>document.querySelector('#status').textContent='No se pudo usar el GPS. Revisa el permiso.',{enableHighAccuracy:true})}function add(){if(!pos){gps();alert('Permite tu ubicación y vuelve a pulsar.');return}let code=prompt('Código del cliente');let name=prompt('Nombre del cliente');if(code&&name){cs.push({id:Date.now(),code:code.toUpperCase(),name,lat:pos.lat,lng:pos.lng,done:false});localStorage.setItem('tat',JSON.stringify(cs));draw()}}function show(){let l=document.querySelector('#list');l.innerHTML=cs.map(c=>'<div><span><b>'+c.name+'</b><br><small>'+c.code+' · '+(c.done?'Visitado':'Pendiente')+'</small></span><button class="green" onclick="visit('+c.id+')">'+(c.done?'Deshacer':'Visitar')+'</button></div>').join('')||'Sin clientes.'}function visit(id){cs=cs.map(c=>c.id==id?Object.assign({},c,{done:!c.done}):c);localStorage.setItem('tat',JSON.stringify(cs));draw();show()}draw()</script></html>
